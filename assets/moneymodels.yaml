#Money Models

reasoning_engine:

  principles:

    ontology:
      inventory: stored_cash
      shelf_space: monetization_asset
      customers: appreciating_assets
      offers: behavioral_engine
      categories: strategic_roles

    retail_definition:
      not: product_sales
      is:
        - inventory_cash_recovery
        - traffic_to_repeat_buyers
        - basket_value_growth
        - visit_frequency_growth
        - sku_monetization_density
        - continuity_buying_behavior

    objective:
      maximize:
        - cash_velocity
        - inventory_velocity
        - customer_lifetime_value
        - monetization_density
      minimize:
        - trapped_inventory
        - margin_leakage
        - operational_friction

  priorities:

    objectives:
      1: inventory_cash_recovery
      2: profitable_customer_acquisition
      3: basket_growth
      4: repeat_frequency
      5: inventory_velocity
      6: margin_expansion
      7: category_expansion
      8: customer_retention
      9: operational_efficiency

    decision_order:
      - preserve_cash
      - increase_revenue
      - maximize_customer_value
      - refine_operations

    critical:
      - cash_velocity
      - inventory_cash_recovery
      - stock_availability
      - margin_integrity

    high:
      - basket_growth
      - repeat_frequency
      - inventory_velocity
      - customer_value

    medium:
      - merchandising
      - pricing
      - assortment
      - category_expansion

    always_reduce:
      - trapped_cash
      - dead_inventory
      - stockouts
      - unnecessary_discounting
      - operational_friction

  mental_models:

    equations:
      inventory: stored_cash
      slow_inventory: trapped_capital
      inventory_velocity: cash_velocity
      shelf_position: advertising_real_estate

    customer_value_path:
      attraction
      -> conversion
      -> basket_expansion
      -> premium_upgrade
      -> continuity
      -> loyalty
      -> lifetime_value

    offer_sequence:
      attraction
      -> upsell
      -> continuity

    revenue_formula:
      traffic
      -> conversion
      -> basket_value
      -> repeat_frequency

    scaling_sequence:
      traffic
      -> conversion
      -> basket
      -> retention
      -> lifetime_value
      -> sustainable_growth

  strategic_roles:

    category:
      traffic: customer_acquisition
      profit: margin_generation
      continuity: repeat_behavior

    sku:
      classify:
        - high_velocity
        - healthy
        - traffic
        - profit
        - continuity
        - dead
        - cash_trap

  allocation:

    inventory_priority:
      - high_velocity
      - high_margin
      - attachment
      - continuity

    shelf_priority:
      - premium
      - high_velocity
      - attachment
      - premium_migration

    promotion_priority:
      - high_velocity
      - premium_upgrade
      - bundle_anchor
      - continuity_driver

    liquidation_priority:
      - dead_inventory
      - cash_trap
      - declining_velocity

    promotional_budget:
      - traffic_generation
      - basket_expansion
      - repeat_behavior
      - margin_expansion

  reusable_reasoning:

    evaluate_every_recommendation_by:
      - cash_velocity
      - inventory_velocity
      - margin
      - basket_growth
      - repeat_frequency
      - customer_value
      - monetization_density

    preserve:
      - causality
      - priority_order
      - operational_constraints

    prohibit:
      - sku_count_as_primary_growth_strategy

    scale_only_if:
      - inventory_velocity_stable
      - stockouts_controlled
      - margin_protected
      - repeat_behavior_improving
      - cash_recovery_consistent

  universal_questions:

    always_ask:
      - where_is_cash_leaking
      - where_is_growth_hidden
      - which_inventory_recovers_cash_fastest
      - which_inventory_traps_cash
      - which_products_expand_basket
      - which_products_trigger_next_offer
      - which_products_create_continuity
      - which_categories_drive_repeat
      - which_customers_are_increasing_value
      - where_margin_is_leaking
      - what_action_maximizes_profitable_customer_value_fastest

  inference_engine:

    entities:

      inventory:

        healthy:
          indicators:
            - high_sell_through
            - stable_margin
            - consistent_velocity
            - repeat_purchase
            - low_inventory_age

        high_velocity:
          indicators:
            - rapid_turnover
            - frequent_replenishment
            - repeat_purchase

        dead:
          indicators:
            - no_movement_45_60_days
            - declining_sell_through
            - weak_attachment
            - weak_category_contribution

        cash_trap:
          indicators:
            - high_inventory_value
            - slow_velocity
            - weak_margin
            - low_repeat_purchase

      customer:

        basket_decline:
          indicators:
            - stable_transactions
            - declining_average_ticket

        retention_decline:
          indicators:
            - declining_repeat_frequency
            - increasing_purchase_interval

        increasing_value:
          indicators:
            - higher_frequency
            - larger_baskets
            - premium_adoption

        declining_value:
          indicators:
            - lower_frequency
            - shrinking_basket
            - increasing_purchase_interval

      margin:

        compression:
          indicators:
            - stable_revenue
            - declining_profit

        premium_opportunity:
          indicators:
            - strong_base_demand
            - premium_alternative_available

      sales:

        velocity_decline:
          indicators:
            - sudden_sales_decline
            - stable_traffic
            - falling_unit_velocity

      category:

        traffic:
          indicators:
            - visit_generation
            - essential_products

        profit:
          indicators:
            - margin_generation
            - convenience_or_specialty

        continuity:
          indicators:
            - recurring_consumption
            - predictable_repurchase

    diagnosis:

      inventory:

        dead:
          causes:
            - offer_mismatch
            - poor_visibility
            - pricing_issue
            - weak_demand
            - overbuying

        cash_trap:
          causes:
            - working_capital_absorption

        velocity_decline:
          causes:
            - pricing_issue
            - visibility_issue
            - competitor_pressure
            - seasonality
            - market_saturation

      margin:

        compression:
          causes:
            - discount_leakage
            - supplier_cost_growth
            - deteriorating_product_mix
            - weak_upselling

      customer:

        basket_decline:
          causes:
            - weak_cross_sell
            - weak_merchandising
            - missing_offer_sequence

        retention_decline:
          causes:
            - weak_continuity_products
            - weak_loyalty
            - weak_engagement

    patterns:

      healthy_inventory:
        if:
          - high_velocity
          - repeat_purchase
          - stable_margin
        then:
          - preserve_inventory
          - increase_visibility

      deteriorating_inventory:
        if:
          - slowing_velocity
          - increasing_inventory_age
        risk: cash

      traffic_without_profit:
        if:
          - customer_acquisition
          - weak_attachment
        leverage:
          - bundle
          - upsell
          - premium_migration

      demand_without_margin:
        if:
          - high_volume
          - low_profit
        leverage:
          - optimize_product_mix

      repeat_without_growth:
        if:
          - stable_repeat_frequency
          - weak_basket
        leverage:
          - expand_offer_sequence

      trapped_cash:
        if:
          - high_inventory
          - slow_turnover

      hidden_growth:
        if_any:
          - premium_upgrade_available
          - bundle_potential
          - attachment_opportunity
          - continuity_gap

    thresholds:

      inventory:

        overstock:
          if:
            inventory_cover_days: ">45-60"
            sell_through: declining
          action:
            - freeze_reorders
            - liquidate

        understock:
          if:
            inventory_cover_days: "<7"
            stockout_frequency: increasing
          priority: critical
          action:
            - immediate_reorder

        dead:
          if:
            movement: none_30_60_days
          action:
            - markdown
            - bundle

      margin:

        compression:
          if:
            gross_margin_change: "<=-10%"

      customer:

        basket_decline:
          if:
            average_basket_change: "<=-10%"

        retention_decline:
          if:
            repeat_frequency_change: "<=-15%"

    response_library:

      inventory:

        healthy:
          actions:
            - maintain_stock
            - increase_visibility
            - test_upsells
            - pair_with_slow_inventory

        dead:
          priority: critical
          actions:
            - stop_reordering
            - markdown
            - aggressive_bundle
            - relocate_high_visibility
            - attach_to_traffic_sku

        cash_trap:
          actions:
            - reduce_reorders
            - liquidate
            - convert_to_bonus
            - bundle_with_high_velocity

        velocity_decline:

          investigation_order:
            - pricing
            - visibility
            - competition
            - seasonality
            - saturation

          actions:
            - temporary_offer
            - reposition
            - bundle_test
            - premium_placement
            - digital_promotion

      margin:

        compression:
          actions:
            - increase_premium_mix
            - improve_attachment_sales
            - reduce_low_margin_share
            - renegotiate_suppliers

        premium_opportunity:
          actions:
            - comparison_signage
            - upsell_training
            - value_bundle
            - adjacent_merchandising

      customer:

        basket_decline:
          actions:
            - launch_bundles
            - checkout_offers
            - bundle_essentials
            - complete_solution_merchandising

        retention_decline:
          actions:
            - loyalty_campaign
            - refill_reminders
            - subscriptions
            - repeat_purchase_incentives

  execution_engine:

    offer_system:

      attraction:
        objective: traffic_generation
        methods:
          - discounted_essentials
          - viral_products
          - entry_combos
          - buy_one_get_one
          - seasonal_items
          - giveaways
          - low_margin_traffic_skus
        success_metrics:
          - foot_traffic
          - conversion
          - attachment_rate
          - downstream_purchase

      upsell:
        objective: basket_expansion
        methods:
          - premium_versions
          - complementary_products
          - larger_sizes
          - checkout_addons
          - convenience_upgrades
          - combo_offers
        success_metrics:
          - attachment_rate
          - incremental_margin
          - basket_growth
          - premium_conversion

      downsell:
        objective: conversion_recovery
        methods:
          - cheaper_alternative
          - smaller_package
          - alternate_brand
          - split_unit
          - financing
        success_metrics:
          - recovered_sales
          - rescued_conversion
          - substitution_effectiveness

      continuity:
        objective: recurring_purchase
        methods:
          - refill_products
          - subscriptions
          - loyalty_programs
          - recurring_bundles
          - prepaid_bundles
          - rewards
        success_metrics:
          - repeat_frequency
          - purchase_interval
          - retention
          - continuity_penetration

    strategy:

      category:

        traffic:
          objective: acquire_visits
          tactics:
            - aggressive_pricing
            - maximum_visibility
            - attach_high_margin_products

        profit:
          objective: maximize_margin
          tactics:
            - premium_placement
            - upsell
            - combo_integration

        continuity:
          objective: increase_repeat_behavior
          tactics:
            - replenishment_reminders
            - recurring_bundles
            - cadence_tracking

      customer:

        visitor: convert
        buyer: expand_basket
        repeat_buyer: increase_frequency
        loyal_customer: maximize_lifetime_value

    action_priority:

      cash_velocity:
        - eliminate_stockouts
        - liquidate_dead_inventory
        - accelerate_inventory_turnover
        - expand_high_velocity_products

      margin:
        - premium_migration
        - attachment_sales
        - bundle_expansion
        - pricing_refinement
        - purchasing_optimization

      customer_value:
        - continuity_products
        - repeat_purchase
        - basket_growth
        - loyalty
        - category_expansion

    operating_cycle:

      sequence:
        - analyze
        - classify
        - diagnose
        - prioritize
        - execute
        - measure
        - optimize
        - repeat

      evaluate_daily:
        - sku_velocity
        - inventory_age
        - margin
        - basket_size
        - repeat_behavior
        - category_performance

      if_improved:
        - reinforce_strategy

      if_declined:
        - diagnose_root_cause
        - deploy_corrective_action
        - monitor_next_cycle

    growth:

      leverage_order:
        - increase_conversion
        - increase_basket
        - increase_repeat_behavior
        - improve_margin
        - expand_customer_value

      never_scale_before:
        - inventory_velocity_stable
        - stockouts_controlled
        - margin_protected
        - repeat_behavior_improving
        - cash_recovery_consistent

    risk_model:

      immediate:
        - stockout_high_velocity_sku
        - dead_inventory_growth
        - collapsing_margin
        - negative_cash_conversion

      emerging:
        - slowing_sell_through
        - declining_basket
        - declining_repeat_frequency
        - premium_conversion_drop
        - inventory_age_growth

      structural:
        - capital_locked_in_inventory
        - category_mix_deterioration
        - weak_offer_sequence
        - loyalty_decay

    failure_states:

      inventory:
        - persistent_dead_inventory
        - repeated_stockouts
        - trapped_working_capital

      monetization:
        - traffic_without_attachment
        - basket_stagnation
        - weak_premium_conversion

      customer:
        - declining_repeat_rate
        - increasing_purchase_interval
        - low_customer_value_growth

      operations:
        - reactive_reordering
        - inefficient_shelf_allocation
        - unmanaged_discounting

    tradeoffs:

      traffic_vs_margin:
        principle: optimize_balance
        traffic_generates: volume
        profit_generates: margin

      inventory_vs_cash:
        principle: prioritize_cash_recovery

      assortment_vs_velocity:
        principle: prioritize_high_velocity_portfolio

      discount_vs_profit:
        discount_only_if:
          - traffic_generation
          - inventory_liquidation
          - profitable_downstream_monetization

    reporting:

      frequency: daily

      include:

        alerts:
          - stockout_risk
          - margin_decline
          - dead_inventory_growth
          - cash_velocity_risk

        opportunities:
          rank_by:
            - expected_cash_velocity
            - expected_inventory_velocity
            - expected_margin_growth
            - expected_basket_growth
            - expected_customer_value

        customer:
          - repeat_frequency
          - premium_adoption
          - basket_change
          - category_shift

        inventory:
          - reorder_candidates
          - liquidation_candidates
          - purchasing_stops

        recommendations:
          - bundles
          - premium_upgrades
          - refill_campaigns
          - loyalty_activation

      every_report_must_include:
        - diagnosis
        - causal_explanation
        - prioritized_actions
        - expected_business_impact

    mission:

      objective:
        maximize_profitable_inventory_cash_recovery_and_customer_lifetime_value

      execution_rule:

        rank_actions_by:
          - cash_velocity
          - inventory_velocity
          - customer_value
          - margin
          - monetization_density

        never_recommend_without:
          - diagnosis
          - causal_chain
          - expected_roi
          - execution_priority
